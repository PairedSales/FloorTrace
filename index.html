<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The real favicons, which have always shipped and were referenced by
         nothing. `logo.svg` was pointed at both of these slots and is a 41 kB
         SVG whose whole body is one base64 PNG — 31 kB gzipped, fetched on
         every cold load, to draw a 16 px tab icon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <!-- viewport-fit=cover hands the notch and the home-indicator strip to the
         page, which is what makes env(safe-area-inset-*) resolve to anything
         other than 0. The shell pads itself with those insets; without the
         flag the bottom bar sits under the indicator. Pinch-zoom is left
         enabled deliberately — the canvas suppresses it locally with
         touch-action, so the app never needs to take it away globally. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FloorTrace" />
    <!-- Matches --shell in each theme, so the browser chrome does not frame the
         app in a colour the app never uses. -->
    <meta name="theme-color" content="#e7eaee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12161b" media="(prefers-color-scheme: dark)" />
    <title>FloorTrace</title>
<!-- Fira Sans/Code are self-hosted via @fontsource; see src/index.css. -->
  </head>
  <body>
    <div id="root"></div>
    <!-- The entry chunk failing is the one case the app cannot handle itself:
         no module means no React, so no error boundary exists to catch it. A
         deploy remints every hashed filename and this file is served with
         `max-age=600`, so for ten minutes afterwards a cached index can name an
         entry nobody serves — the request returns a 404 page, nothing mounts,
         and the screen stays blank with no error a user could report.

         Two triggers, one recovery: a load error on the module tag, and a
         watchdog for the failures that do not raise one. Reloading against a
         one-shot query parameter is what makes the browser re-ask the origin;
         a plain reload is served the same cached index and fails identically.
         `sessionStorage` keeps it to a single attempt, so a fault that is not a
         stale build cannot become a reload loop. -->
    <script>
      (function () {
        var KEY = 'floortrace:recovering-stale-build';
        var recover = function () {
          try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) { /* storage disabled; one reload still beats a blank page */ }
          var url = new URL(window.location.href);
          url.searchParams.set('rebuild', String(Date.now()));
          window.location.replace(url.toString());
        };
        window.addEventListener('error', function (event) {
          var el = event.target;
          if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) recover();
        }, true);
        // Ten seconds is well past a cold parse of the entry on a slow phone,
        // and the check is for *any* mounted node rather than a healthy app.
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount === 0) recover();
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
