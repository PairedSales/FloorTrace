name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  # Run the checks on the PR too. Triggering on push-to-master alone made this
  # a deploy gate rather than a merge gate: a failing lint/test/benchmark
  # blocked the deploy but not the merge, so master could carry a regression
  # while the only symptom was a site that quietly stopped updating.
  pull_request:
    branches:
      - master
  workflow_dispatch:  # Allows manual trigger from Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# The deploy must stay serialised on "pages": GitHub Pages accepts one
# deployment at a time, and two racing to publish is a site that ends up
# showing whichever lost.
#
# PR checks must not share that queue, and did until now. A group holds one
# run and one *pending* run for the whole repository, so a third arrival
# evicted whoever was waiting — which is a PR check dying at ~6s having never
# started a job, reported by `gh pr checks` as "no checks reported" rather than
# as a failure. With three PRs open at once it also meant each waited behind
# the others *and* behind every master deploy in between. Measured over one
# afternoon: two evictions in thirty runs, one of them after eight minutes
# pending.
#
# Cancelling in progress is right for a PR and wrong for a deploy, for the same
# reason: a second push to a branch makes the first run's answer worthless,
# while a second push to master still has to publish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 20 reached end of life in April 2026. It was not merely stale: a
      # devDependency's `engines` can require newer, and the failure lands only
      # here. jsdom 30 (via undici 8's `webidl.util.markAsUncloneable`) wants
      # >= 22.19, so the hook-test harness passed locally and failed this job
      # with unhandled TypeErrors while every test reported green.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Detection accuracy against the fixture plans. It already sets a
      # non-zero exit code on a failed check; not running it meant a redesign
      # could be told "all green" while discarding every notch and wing.
      - name: Detection benchmark
        run: npm run bench:detection

      # The scale selector governs every reported area, and nothing else in CI
      # exercises it: bench:detection scores room rectangles, not the one
      # px/ft the project settles on from them.
      - name: Scale benchmark
        run: npm run bench:scale

      - name: Build
        run: npm run build

      # Pages steps are for the real deploy only. On a pull_request the job
      # exists to run the checks above; configuring Pages from a PR would at
      # best waste a step and at worst publish unmerged code.
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
